name: Legacy .NET Framework build

on:
  push:
    branches: [master, "maintenance/**"]
    paths:
      - "PSXDownloadHelper/**"
      - ".github/workflows/legacy-build.yml"
  pull_request:
    paths:
      - "PSXDownloadHelper/**"
      - ".github/workflows/legacy-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Install .NET Framework 4.0 reference assemblies
        shell: pwsh
        run: |
          nuget install Microsoft.NETFramework.ReferenceAssemblies.net40 -Version 1.0.3 -OutputDirectory "$env:RUNNER_TEMP\reference-assemblies" -NonInteractive
          $referenceRoot = Join-Path "$env:RUNNER_TEMP\reference-assemblies\Microsoft.NETFramework.ReferenceAssemblies.net40.1.0.3" "build"
          if (-not (Test-Path (Join-Path $referenceRoot ".NETFramework\v4.0"))) { throw "Reference assemblies package layout was not found: $referenceRoot" }
          "LEGACY_REFERENCE_ROOT=$referenceRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build original .NET Framework solution
        shell: pwsh
        run: |
          $solution = "PSXDownloadHelper/PSSDownloadHelper.sln"
          if (-not (Test-Path $solution)) { throw "Solution not found: $solution" }
          msbuild $solution /m /p:Configuration=Release /p:RestorePackages=false "/p:TargetFrameworkRootPath=$env:LEGACY_REFERENCE_ROOT" /verbosity:minimal
